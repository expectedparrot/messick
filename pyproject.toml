[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messick"
version = "0.2.0"
description = "Agent-first pretesting and validation for EDSL surveys"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
edsl = ["edsl>=0.1"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
messick = "messick.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
messick = []
