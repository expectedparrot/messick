[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messick"
version = "0.1.0"
description = "Tiered validation framework for EDSL studies"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "edsl>=0.1",
    "pandas>=2.0",
    "numpy>=1.24"
]

[project.scripts]
messick = "messick.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
messick = []
